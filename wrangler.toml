# Bosta-Orders-Upload — الشكل المعتمد لأدوات EcomModa
# ⚠️ name لازم يطابق اسم الـ Worker في داشبورد Cloudflare حرف بحرف.
#    لو اختلفوا، الـ build مش بيفشل — بينشر Worker جديد والأصلي بيتجمّد بصمت.

name               = "bosta-orders-upload-worker"
main               = "index.js"
compatibility_date = "2025-01-01"
workers_dev        = true

[observability]
enabled = true

# ─── D1 ──────────────────────────────────────────────
# الـ binding دايمًا "DB" — أي اسم تاني والكتابة بتفشل بصمت
[[d1_databases]]
binding       = "DB"
database_name = "ecommoda-dev-logs"
database_id   = "90db62d3-bd7e-4d92-912b-10fc78eeb565"

# ─── Vars (نص عادي — مش أسرار) ────────────────────────
# دي بتتطبّق فعليًا مع Workers Builds (اتأكدنا 22-08-2026).
# الأداة دي مش أداة مخزون → LOCATION_ID مش مطلوب.
[vars]
SHOP_DOMAIN = "6c7e1a-53.myshopify.com"

# ─── KV (اختياري) ─────────────────────────────────────
# كتالوج مدن/مناطق بوسطة بيتكاش. من غير الـ binding ده الـ Worker بيستخدم
# Cache API تلقائيًا (نفس المدة، من غير أي إعداد) — فده تحسين مش شرط تشغيل.
# لو اتفعّل: Workers & Pages → KV → Create namespace، وحطّ الـ id هنا.
# [[kv_namespaces]]
# binding = "CATALOG_KV"
# id      = "<namespace-id>"

# ⚠️ الأسرار مبتتكتبش هنا أبدًا.
#    Worker → Settings → Variables and Secrets → علّم Secret
#    المطلوب: WORKER_SECRET · CLIENT_ID · CLIENT_SECRET · BOSTA_API_KEY
#    وبعدها: Deployments → Version History → ⋯ → Promote version
